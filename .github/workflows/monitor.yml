name: Monitorar fontes

on:
  schedule:
    # Todo dia às 8h (Brasília).
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, dom, xml, curl, iconv
          coverage: none

      - run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Restaurar estado da coleta
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: collect-state-monitor-${{ github.run_id }}
          restore-keys: collect-state-

      - name: Verificar fontes
        id: check
        run: |
          set +e
          php itape check-sources --live --markdown > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: Abrir ou atualizar issue
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create fonte-com-problema --color d73a4a --description "Coleta de alguma fonte falhou" --force
          number=$(gh issue list --label fonte-com-problema --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "Fonte com problema na coleta" --label fonte-com-problema --body-file report.md
          fi
